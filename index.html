<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大冶市城市智能预警平台 · PC 管理端原型（Demo）</title>
<!--
==================================================================================
 大冶市城市智能预警平台 · PC 管理端 Demo 原型（单文件 / 内联 CSS+JS / 无外部依赖）
 依据：09-PC端功能优化与补充方案.md
 联动：与 07-移动端HTML原型.html 共用模拟数据源 localStorage[dyyj_shared_v1]
       统一字段：id / lv / st / phase(待受理·处置中·已办结) / src / area / place /
                 dispatchees[] / signals[] / events[] / report{} / dlXxx(时限时间戳)
 业务闭环：信号·上报 → 研判 → 工单 → 派发 → 签收 → 到场 → 进展 → 结果报告 → 核查 → 归档
==================================================================================
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:#EDF1F7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
 color:#1B2430;font-size:13px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#CBD5E3;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 布局 ---------- */
#app{display:flex;height:100vh;overflow:hidden}
#nav{width:216px;flex:0 0 216px;background:#0B2F63;color:#C9D8EE;display:flex;flex-direction:column;transition:width .18s}
#nav.mini{width:56px;flex:0 0 56px}
#nav .brand{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:9px;padding:0 14px;background:#082549;color:#fff;font-weight:600;font-size:14px;overflow:hidden}
#nav .brand .lg{width:26px;height:26px;flex:0 0 26px;border-radius:7px;background:linear-gradient(135deg,#1668DC,#0F4C9B);display:flex;align-items:center;justify-content:center}
#nav .brand em{font-style:normal;font-size:11px;font-weight:400;color:#7FA3D6;display:block}
#nav .scroll{flex:1;overflow-y:auto;padding:8px 0 20px}
#nav .grp{font-size:11px;color:#5D7FAE;padding:12px 16px 6px;letter-spacing:1px}
#nav.mini .grp{text-align:center;padding:12px 0 6px;font-size:10px}
#nav .mi{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;font-size:13px;color:#C9D8EE;border-left:3px solid transparent}
#nav .mi:hover{background:rgba(255,255,255,.06);color:#fff}
#nav .mi.on{background:rgba(22,104,220,.28);color:#fff;border-left-color:#4E96F6;font-weight:600}
#nav .mi .ic{width:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;opacity:.9}
#nav .mi .cnt{margin-left:auto;background:#D92B2B;color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;
 display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:600}
#nav.mini .mi span.tx{display:none}
#nav .foot{flex:0 0 auto;padding:10px 14px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#6E8FBF}
#nav .fold{cursor:pointer;color:#8FB0DC;font-size:11px;padding:6px 14px;text-align:right}

#wrap{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:52px;flex:0 0 52px;background:#fff;border-bottom:1px solid #E6EAF2;display:flex;align-items:center;padding:0 18px;gap:12px}
#topbar .crumb{display:flex;align-items:baseline;gap:10px;min-width:0}
#topbar .crumb b{font-size:16px;font-weight:700;color:#1B2430;letter-spacing:.5px;white-space:nowrap}
#topbar .crumb small{font-size:11.5px;color:#8A94A6;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-pill{display:flex;align-items:center;gap:6px;height:32px;background:#fff;border:1px solid #E1E6EF;border-radius:8px;
 padding:0 12px;font-size:12px;color:#4A5666;transition:border-color .15s,box-shadow .15s;white-space:nowrap}
.tb-pill:hover{border-color:#B9D2F7;box-shadow:0 1px 4px rgba(20,40,80,.08)}
.tb-pill b{color:#1B2430;font-weight:600;font-variant-numeric:tabular-nums}
/* 顶栏消息铃铛 */
.tb-bell{position:relative;width:32px;height:32px;flex:0 0 32px;border:1px solid #E1E6EF;border-radius:8px;background:#fff;
 color:#4A5666;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s,box-shadow .15s,color .15s}
.tb-bell:hover{border-color:#B9D2F7;color:#1668DC;box-shadow:0 1px 4px rgba(20,40,80,.08)}
.tb-bell .bdg{position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:#D92B2B;
 color:#fff;font-size:10px;line-height:15px;text-align:center;font-weight:600;box-sizing:border-box;border:1.5px solid #fff}
.tb-sep{width:1px;height:20px;background:#E6EAF2;flex:0 0 1px;margin:0 2px}
#topbar select.f{height:32px;border-radius:8px}
/* 侧边栏二级菜单（系统配置子页） */
#nav .mi.par .arw{margin-left:auto;font-size:11px;color:#8FB0DC;transition:transform .15s;flex:0 0 auto}
#nav .mi.par.open .arw{transform:rotate(90deg)}
#nav .mi.sub{padding:7px 14px 7px 43px;font-size:12.5px;gap:8px}
#nav .mi.sub .ic{width:15px;flex:0 0 15px}
#nav.mini .mi.sub{display:none}
#nav.mini .mi.par .arw{display:none}
/* 消息弹窗列表 */
.msg-list{max-height:380px;overflow-y:auto;border:1px solid #E9EDF4;border-radius:9px}
.msg-item{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-bottom:1px solid #F1F4F9;cursor:pointer}
.msg-item:last-child{border-bottom:none}
.msg-item:hover{background:#F7FAFE}
.msg-item .dot{margin-top:6px}
.msg-popup .segv{max-width:460px}
#main{flex:1;overflow:auto;background:#F4F6FA;padding:14px 16px 40px}
@media (max-width:1180px){#main{padding:12px}}

/* ---------- 通用组件 ---------- */
.card{background:#fff;border-radius:10px;border:1px solid #E9EDF4;box-shadow:0 1px 2px rgba(20,40,80,.04)}
.card .hd{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid #F1F4F9}
.card .hd h3{margin:0;font-size:14px;font-weight:600;color:#1B2430}
.card .hd .sub{font-size:11px;color:#8A94A6;font-weight:400;margin-left:8px}
.card .bd{padding:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
/* 总览首行：三卡统一卡片样式 · 左中右等宽（最新事前预警 / 工单统计 / 告警类型分布） */
.govrow{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.govrow .card{display:flex;flex-direction:column}
.govrow .card .bd{flex:1}
.govrow .card .hd h3{display:flex;align-items:center;gap:6px}
/* 中卡：工单统计（2×2 指标 · 填满卡片） */
.kpigrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:6px;height:100%}
.govrow .kpi{display:flex;flex-direction:column;justify-content:center;padding:5px 12px}
.govrow .kpi .t{font-size:11px}
.govrow .kpi .n{font-size:21px;line-height:26px}
.govrow .kpi .d{font-size:10.5px}
.govrow .kpi .ico{right:10px;top:7px}
.govrow .kpi .ico svg{width:18px;height:18px}
/* 右卡：告警类型分布（类型行：图标徽章 / 名称+类别 / 占比条 / 计数+占比） */
.type-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:8px;height:100%}
.ty-row{display:flex;align-items:center;gap:9px;padding:6px 10px;border:1px solid #EDF0F5;border-radius:8px;
 background:#FAFBFD;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.ty-row:hover{border-color:var(--tc);background:#fff;box-shadow:0 2px 8px rgba(20,40,80,.08)}
.ty-row:focus-visible{outline:2px solid #9CC2F5;outline-offset:1px}
.ty-ico{font-style:normal;flex:0 0 auto;width:26px;height:26px;border-radius:7px;background:var(--tc);color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.ty-mid{flex:1;min-width:0}
.ty-name{font-size:12px;font-weight:600;color:#1B2430;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ty-cat{font-size:10px;color:#8A94A6;font-weight:400;margin-left:4px}
.ty-bar{height:4px;border-radius:2px;background:#EDF0F5;margin-top:5px;overflow:hidden}
.ty-bar span{display:block;height:100%;border-radius:2px;background:var(--tc)}
.ty-num{flex:0 0 auto;text-align:right;margin-left:2px}
.ty-num b{display:block;font-size:17px;line-height:17px;font-weight:700;color:var(--tc)}
.ty-num .ty-pct{display:block;font-size:10px;color:#8A94A6;margin-top:2px}
/* 标题后的说明「?」气泡 */
.qmark{position:relative;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
 border-radius:50%;background:#E8F1FE;color:#1668DC;font-size:10px;font-weight:700;cursor:help;outline:none;flex:0 0 auto}
.qmark::before{content:"";position:absolute;left:7px;top:calc(100% + 4px);border:5px solid transparent;border-bottom-color:#1B2430;
 opacity:0;visibility:hidden;transition:opacity .15s;z-index:31}
.qmark::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 9px);width:300px;padding:10px 12px;
 background:#1B2430;color:#fff;font-size:11.5px;font-weight:400;line-height:18px;border-radius:8px;
 box-shadow:0 6px 18px rgba(20,40,80,.22);white-space:normal;text-align:left;opacity:0;visibility:hidden;
 transition:opacity .15s;z-index:30;pointer-events:none}
.qmark:hover::before,.qmark:focus::before,.qmark:hover::after,.qmark:focus::after{opacity:1;visibility:visible}
/* 首行紧凑化：内容区/字段行收紧，整行与两栏高度同步下降 */
.govrow .card .hd{padding:9px 14px}
.govrow .card .bd{padding:10px 14px}
.govrow .kv{padding:4px 0}
.govrow .hr{margin:8px 0}
/* 分级响应措施：可点击入口（内容收进弹窗） */
.ms-entry{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;
 border:1px solid #DCE7F7;border-radius:8px;background:#F7FAFF;cursor:pointer}
.ms-entry:hover{background:#EDF5FF;border-color:#9CC2F5}
.ms-entry .t{font-size:12px;color:#1668DC;font-weight:600}
.ms-entry .a{font-size:11px;color:#8FB6F0}
@media (max-width:1400px){.g4{grid-template-columns:repeat(2,1fr)}.ty-cat{display:none}}
@media (max-width:1180px){.govrow{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .govrow>:last-child{grid-column:1/-1}.type-list{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){.g3,.g23,.g32,.govrow{grid-template-columns:1fr}
 .govrow>:last-child{grid-column:auto}}
@media (max-width:760px){.type-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between}
.muted{color:#8A94A6}.small{font-size:12px}.tiny{font-size:11px}.b{font-weight:600}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}
.hr{height:1px;background:#EEF1F6;margin:10px 0}

/* 等级/状态 */
.lv{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;line-height:18px;white-space:nowrap}
.lv-blue{color:#0B5FD0;background:#E8F1FE}
.lv-yellow{color:#A56A00;background:#FFF4DE}
.lv-orange{color:#C1510A;background:#FFEBDD}
.lv-red{color:#C21F1F;background:#FDE8E8}
.lv-resp{color:#6B4BE8;background:#EFEAFE}
.lv-gray{color:#6B7688;background:#F0F2F6}
.lv-green{color:#0E7A4C;background:#E5F6EE}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.b{background:#1668DC}.dot.y{background:#E8A317}.dot.o{background:#E8590C}.dot.r{background:#D92B2B}.dot.g{background:#1E9E63}.dot.gr{background:#B6BFCB}

/* 按钮 */
.btn{height:32px;padding:0 14px;border-radius:8px;border:none;background:#1668DC;color:#fff;font-size:13px;font-weight:500;
 cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-family:inherit}
.btn:hover{opacity:.9}
.btn.ghost{background:#fff;color:#1668DC;border:1px solid #B9D2F7}
.btn.line{background:#fff;color:#4A5666;border:1px solid #D7DEE9}
.btn.danger{background:#D92B2B}
.btn.warn{background:#E8590C}
.btn.ok{background:#1E9E63}
.btn.gray{background:#F0F2F6;color:#6B7688}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-xs{height:24px;padding:0 8px;font-size:11px;border-radius:6px}
.lnk{color:#1668DC;cursor:pointer;font-size:12px}
.lnk:hover{text-decoration:underline}

/* 表格 */
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{background:#F7F9FC;color:#6B7688;font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid #E9EDF4;white-space:nowrap}
table.tb td{padding:9px 10px;border-bottom:1px solid #F1F4F9;color:#33404F;vertical-align:middle}
table.tb tr:hover td{background:#F9FBFE}
table.tb tr.click{cursor:pointer}
table.tb td.nowrap{white-space:nowrap}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;background:#F0F2F6;color:#6B7688;margin:0 3px 3px 0}
/* 告警类型标签（六类通用） */
.ttag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px 2px 5px;border-radius:4px;
 background:color-mix(in srgb, var(--tc,#8A94A6) 12%, #fff);color:var(--tc,#6B7688);border:1px solid color-mix(in srgb, var(--tc,#8A94A6) 28%, #fff);white-space:nowrap}
.ttag i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:3px;background:var(--tc,#8A94A6);color:#fff;font-size:10px}
.ttag.mini i{display:none}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;border:1px solid #E3E8F0;background:#fff;
 cursor:pointer;font-size:12px;color:#33404F}
.tchip.on{border-color:var(--tc,#1668DC);background:color-mix(in srgb, var(--tc,#1668DC) 8%, #fff);color:var(--tc,#1668DC);font-weight:600}
.tchip i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;background:var(--tc,#8A94A6);color:#fff;font-size:11px}

/* 表单 */
.fi{display:flex;align-items:flex-start;gap:8px;padding:7px 0}
.fi .lab{flex:0 0 96px;color:#6B7688;font-size:12px;line-height:24px;text-align:right}
.fi .val{flex:1;min-width:0}
input.f,textarea.f,select.f{width:100%;font-family:inherit;font-size:13px;color:#1B2430;border:1px solid #D7DEE9;border-radius:7px;
 padding:6px 9px;outline:none;background:#fff}
input.f:focus,textarea.f:focus,select.f:focus{border-color:#8FB6F0;box-shadow:0 0 0 2px rgba(22,104,220,.12)}
textarea.f{min-height:64px;line-height:19px;resize:vertical}
.chip{padding:4px 10px;border-radius:14px;background:#F0F2F6;color:#4A5666;font-size:12px;border:1px solid transparent;cursor:pointer;display:inline-block}
.chip.on{background:#E8F1FE;color:#1668DC;border-color:#9CC2F5;font-weight:600}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;padding:5px 8px;border:1px solid #E3E8F0;border-radius:7px;background:#fff}
.chk.on{border-color:#9CC2F5;background:#F2F8FF;color:#0F4C9B;font-weight:600}
.chk .box{width:14px;height:14px;border-radius:3px;border:1.5px solid #C6CFDC;display:flex;align-items:center;justify-content:center;flex:0 0 14px}
.chk.on .box{background:#1668DC;border-color:#1668DC}
.segv{display:flex;gap:2px;background:#F0F2F6;padding:3px;border-radius:9px}
.segv div{flex:1;text-align:center;padding:6px 12px;border-radius:7px;font-size:12.5px;color:#4A5666;cursor:pointer;white-space:nowrap}
.segv div.on{background:#fff;color:#1668DC;font-weight:600;box-shadow:0 1px 3px rgba(20,40,80,.12)}

/* 统计卡 */
.kpi{background:#fff;border:1px solid #E9EDF4;border-radius:10px;padding:13px 14px;position:relative;overflow:hidden}
.kpi .t{font-size:12px;color:#8A94A6;display:flex;align-items:center;gap:6px}
.kpi .n{font-size:26px;font-weight:700;line-height:34px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11px;color:#8A94A6;display:flex;align-items:center;gap:6px}
.kpi .ico{position:absolute;right:12px;top:12px;opacity:.16}
.kpi.r .n{color:#D92B2B}.kpi.o .n{color:#E8590C}.kpi.b .n{color:#1668DC}.kpi.g .n{color:#1E9E63}
.badge{min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#D92B2B;color:#fff;font-size:10px;line-height:16px;
 text-align:center;font-weight:600;display:inline-block}

/* 时间轴 */
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:#E3E8F0}
.tl-item{position:relative;padding-bottom:13px}
.tl-item::before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:#C6CFDC;border:2px solid #fff}
.tl-item.now::before{background:#1668DC;box-shadow:0 0 0 3px rgba(22,104,220,.18)}
.tl-item.red::before{background:#D92B2B}
.tl-item .tt{font-size:11px;color:#8A94A6}
.tl-item .tx{font-size:12.5px;color:#33404F;line-height:19px;margin-top:2px}

/* kv */
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12.5px;border-bottom:1px dashed #F1F4F9}
.kv:last-child{border-bottom:none}
.kv .k{color:#8A94A6;flex:0 0 92px}
.kv .v{flex:1;text-align:right;color:#1B2430;word-break:break-all}
.cd{font-variant-numeric:tabular-nums;font-weight:600}
.cd.over{color:#D92B2B}
.empty{text-align:center;padding:46px 20px;color:#A6AEBC;font-size:13px}
.tipbar{display:flex;gap:9px;align-items:flex-start;background:#FFF8E6;border:1px solid #FFE7AE;border-radius:9px;padding:9px 12px;color:#8A5A00;font-size:12px;line-height:18px}
.tipbar.info{background:#EFF6FF;border-color:#BBD7FA;color:#0F4C9B}
.tipbar.red{background:#FDECEA;border-color:#F6C9C4;color:#A81515}
.banner{border-radius:10px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,#D92B2B,#A81515)}
.banner.o{background:linear-gradient(135deg,#E8590C,#C2410C)}
.banner.b{background:linear-gradient(135deg,#1668DC,#0F4C9B)}

/* 遮罩/抽屉/弹窗/toast：遮罩只覆盖背景，弹窗与抽屉始终在遮罩之上；内容超高时由遮罩自身滚动 */
.mask{position:fixed;inset:0;background:rgba(15,25,40,.42);z-index:200;display:flex;
 align-items:center;justify-content:center;overflow-y:auto;overscroll-behavior:contain;padding:24px 16px}
#drawerWrap{position:fixed;inset:0;z-index:120;display:none}
#drawerWrap .mask{position:absolute;z-index:1;overflow:hidden}
.drawer{position:absolute;right:0;top:0;bottom:0;width:640px;max-width:94vw;background:#F4F6FA;box-shadow:-8px 0 26px rgba(15,30,60,.18);
 display:flex;flex-direction:column;z-index:2}
.drawer .dh{height:50px;flex:0 0 50px;background:linear-gradient(135deg,#0F4C9B,#1668DC);color:#fff;display:flex;align-items:center;padding:0 14px;gap:8px}
.drawer .dh .t{font-size:15px;font-weight:600}
.drawer .db{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px}

<script>
/* ==================================================================
   一、字典与常量（与移动端 07-移动端HTML原型.html 保持一致）
   ================================================================== */
/* 统一工单等级：全站唯一一套分级（蓝 / 黄 / 橙 / 红）；工单与事前预警共用同一套值，仅按语境加前缀 */
var ELV={blue:{t:'蓝色',c:'lv-blue'},yellow:{t:'黄色',c:'lv-yellow'},orange:{t:'橙色',c:'lv-orange'},red:{t:'红色',c:'lv-red'}};
var ELV_ORDER=['blue','yellow','orange','red'];
function elvName(k){return '工单·'+((ELV[k]||{}).t||k||'—')}
function riskLvName(k){return '火险·'+((ELV[k]||{}).t||k||'—')}
/* 旧共用数据源兼容键：上一版旧概念值统一迁移为工单语义（转义写法，避免新版本保留旧概念） */
var LEGACY={word:'\u4e8b\u4ef6',status:'\u4e8b\u4ef6\u72b6\u6001',lv:'\u4e8b\u4ef6\u7b49\u7ea7',risklv:'\u706b\u9669\u7b49\u7ea7',
 msgType:'\u4e8b\u4ef6',repSt:'\u5df2\u8f6c\u4e8b\u4ef6',smsVar:'{\u4e8b\u4ef6\u7f16\u53f7}'};
/* 分级响应措施库（默认配置，可在「事前预警管理 → 分级响应措施库」页面编辑并保存到共用数据源） */
var MS_LIB={
 blue:['加强值班值守，保持通讯畅通','护林员正常巡护频次','村村响广播播报防火提示'],
 yellow:['加强林区巡查，重点路段设卡','禁止野外用火宣传到户','扑火装备检查保养到位'],
 orange:['严禁野外用火，林区实行封山管理','各乡镇半专业扑火队进入待战状态','护林员加密巡护频次，重点时段 10:00—16:00','应急、林业、消防 24 小时值班值守','扑火物资装备前置到重点村'],
 red:['全市禁止一切野外用火，林区全面封山','扑火队伍全员进入应急状态、靠前驻防','中小学及景区停止野外活动','市政府发布禁火令，公安、林业联合执法','市森防指进入战时状态，随时启动应急响应']
};
var MS_LEVELS=['blue','yellow','orange','red'];
/* 工单类型字典：仅「单一工单 / 多跨工单」，工单管理、筛选、新建工单、详情统一口径 */
var ETYPE=['单一工单','多跨工单'];

/* ==================================================================
   统一状态契约（大屏 20 号 / PC 后台 11 号共用同一份定义）
   业务口径：一条告警信号记录贯穿「预警 → 预警工单」全生命周期；
   研判确认后【沿用该条数据变更状态】生成工单，不新建第二份数据对象。
   预警详情页与工单详情页为同一组件 openUnified()，仅 rec.status 不同。
   两端共用 localStorage['dyyj_shared_v1'].onemapRecs 命名空间，状态变更实时回写。
   PC 后台 = 业务主端（研判/指派/签收/复核/归档/台账）；大屏 = 指挥视图（读同库、发起流转）。
   ================================================================== */
var SHARED_NS='onemapRecs';
var USTATUS={
 waitConfirm:{t:'待确认',phase:'warn', c:'lv-blue',  stage:1,d:'告警信号接入，等待研判确认'},
 waitAssign: {t:'待指派',phase:'warn', c:'lv-blue',  stage:2,d:'研判已确认，等待指定处置单位'},
 waitSign:   {t:'待签收',phase:'order',c:'lv-orange',stage:3,d:'工单已生成并派发，等待属地签收'},
 working:    {t:'处置中',phase:'order',c:'lv-orange',stage:4,d:'现场处置与进展反馈中'},
 overtime:   {t:'已超时',phase:'order',c:'lv-red',   stage:4,d:'签收 / 反馈 / 报告超限时触发，超时事实全程留痕且不清除'},
 waitRecheck:{t:'待复核',phase:'order',c:'lv-blue',  stage:5,d:'处置结果已提交，等待现场复核'},
 returned:   {t:'退回待补充',phase:'order',c:'lv-red',stage:5,d:'复核不通过，退回补充材料或重新现场处置'},
 done:       {t:'已完成',phase:'order',c:'lv-green',stage:6,d:'复核通过，处置完成、待评估销号'},
 archived:   {t:'已归档',phase:'order',c:'lv-gray', stage:7,d:'评估销号完成，归档留痕'}
};
/* 主链 7 态：待确认 → 待指派(可跳过) → 待签收 → 处置中 → 待复核 → 已完成 → 已归档
   旁支：处置中 ⇄ 已超时；待复核 ⇄ 退回待补充。二者均为可回边状态，非终态。 */
var UMAIN=['waitConfirm','waitAssign','waitSign','working','waitRecheck','done','archived'];
var UTRANS={
 /* 研判确认：按是否选择处置单位动态决定「待签收 / 待指派」，见 uTransition */
 waitConfirm:[{a:'confirm',    t:'研判确认',to:'waitSign',primary:1},
              {a:'falseAlarm', t:'误报归档',to:'archived'}],
 waitAssign: [{a:'assign',       t:'指派单位并派发',          to:'waitSign',primary:1}],
 waitSign:   [{a:'sign',         t:'属地签收工单',            to:'working',primary:1}],
 working:    [{a:'submitResult', t:'提交处置结果',            to:'waitRecheck',primary:1},
              {a:'markOvertime', t:'标记超时',                to:'overtime'}],
 overtime:   [{a:'urge',         t:'催办并继续处置',          to:'working',primary:1},
              {a:'submitResult', t:'直接提交处置结果',        to:'waitRecheck'}],
 waitRecheck:[{a:'recheckPass',  t:'复核通过',                to:'done',primary:1},
              {a:'recheckBack',  t:'复核退回',                to:'returned'}],
 returned:   [{a:'resubmit',     t:'补充材料并重新提交',      to:'waitRecheck',primary:1},
              {a:'rework',       t:'重新现场处置',            to:'working'}],
 done:       [{a:'archive',      t:'评估销号 · 归档',          to:'archived',primary:1}],
 archived:   []
};
/* PC 内部状态键 ↔ 统一状态键：内部键保留以兼容移动端与既有业务字段 */
var ST_TO_U={signals:'waitConfirm',judging:'waitConfirm',approving:'waitAssign',assigning:'waitAssign',
 dispatching:'waitSign',signing:'waitSign',working:'working',checking:'waitRecheck',
 done:'done',archived:'archived',falseAlarm:'archived'};
var U_TO_ST={waitConfirm:'signals',waitAssign:'assigning',waitSign:'signing',working:'working',
 overtime:'working',waitRecheck:'checking',returned:'working',done:'done',archived:'archived'};
var ULV={red:'红色',orange:'橙色',yellow:'黄色',blue:'蓝色',or:'橙色',ye:'黄色',bl:'蓝色'};
var ULV_KEY={red:'red',orange:'orange',yellow:'yellow',blue:'blue',or:'orange',ye:'yellow',bl:'blue'};
var UBASIS=[
 '热成像 CH-09 连续 3 帧识别高温热源，温度 78℃ 超阈值 12℃',
 'NOAA-20 卫星热点像元与点位偏差 0.6 km，时间差 14 分钟',
 '护林员现场上传照片可见明火，位于东南坡林缘',
 '未来 24 小时无有效降水，午后阵风 6 级，火险等级：橙'
];
function uRecs(){if(!Array.isArray(DB.onemapRecs))DB.onemapRecs=[];return DB.onemapRecs}
function uFind(id){
 if(!id)return null;var a=uRecs();
 for(var i=0;i<a.length;i++){var r=a[i];if(r.id===id||r.wo===id||r.srcId===id||r.pcId===id)return r}
 return null;
}
function uBase(k){return k==='overtime'?'working':k==='returned'?'waitRecheck':k}
function uNextWo(){
 var n=2620;uRecs().forEach(function(r){var m=/WO-(\d+)/.exec(r.wo||'');if(m)n=Math.max(n,parseInt(m[1],10)+1)});
 return 'WO-'+n;
}
/* 一条 PC 工单 / 告警信号对应一条统一记录；已存在则复用，绝不新建第二份 */
function uEnsure(x,kind){
 if(!x)return null;
 var r=uFind(x.id)||uFind(x.srcId||'')||uFind(x.oid||'');
 if(r)return r;
 var at=(typeof ATYPE!=='undefined'&&ATYPE[x.type])||{n:x.type||'森林防火'};
 var isSig=kind==='signal';
 var r0={
  id:isSig?x.id:('U-'+x.id),wo:isSig?(x.oid||''):x.id,
  status:isSig?'waitConfirm':(ST_TO_U[x.st]||'waitSign'),
  lv:x.lv||'yellow',type:at.n||x.type,town:x.area||'',spot:'',src:x.src||'',
  time:x.t||x.create||now(),desc:x.d||x.title||'',
  unit:(x.dispatchees||[]).join('、')||x.owner||'待指派',coord:x.place||x.area||'',
  area:x.area0||'待现场核实',line:'—',overtime:x.uOvertime||0,
  signAt:String(x.sign||'').slice(11,16)||'',
  report:x.report?(x.report.desc||x.report.note||'已提交结果报告'):'',
  recheck:x.uRecheck||'',basis:(x.uBasis||UBASIS).slice(),
  timeline:(x.events||[]).map(function(e){return {t:e.t,b:e.b,x:e.x}}),
  origin:'PC',srcId:x.id,pcId:x.id
 };
 /* 待确认 / 待指派：尚未指派处置单位，字段保持为空 */
 if(r0.status==='waitConfirm'||r0.status==='waitAssign')r0.unit='';
 if(!r0.timeline.length)r0.timeline=[{t:String(r0.time).slice(11,16)||nowHM(),b:'平台自动',
   x:'告警信号接入，建立统一记录 '+r0.id+'（状态：'+USTATUS[r0.status].t+'）'}];
 uRecs().push(r0);
 return r0;
}
function uSync(){
 try{
  DB.signals.forEach(function(s){uEnsure(s,'signal')});
  DB.orders.forEach(function(o){uEnsure(o,'order')});
  uRecs().forEach(function(r){if(!USTATUS[r.status])r.status='waitSign';
   if(!Array.isArray(r.timeline))r.timeline=[];if(!Array.isArray(r.basis))r.basis=UBASIS.slice();});
 }catch(e){}
}
function uBadge(k){var S=USTATUS[k]||USTATUS.waitConfirm;return '<span class="lv '+S.c+'">'+S.t+'</span>'}
/* 主链步骤条：当前态高亮；旁支状态用红色提示条说明主链停留位置 */
function uSteps(r){
 var cur=USTATUS[r.status].stage,base=uBase(r.status),side=base!==r.status;
 var h='<div style="display:flex;gap:4px;flex-wrap:wrap;margin:2px 0 6px">';
 UMAIN.forEach(function(k){
  var st=USTATUS[k].stage,cls=k===base?'now':(st<cur?'done':'wait');
  var bg=cls==='now'?'#1668DC':cls==='done'?'#E9F7EF':'#F3F5F9';
  var fg=cls==='now'?'#fff':cls==='done'?'#1E9E63':'#8A94A6';
  var bd=cls==='now'?'#1668DC':cls==='done'?'#BFE6D0':'#E6EAF2';
  h+='<div style="flex:1;min-width:78px;text-align:center;background:'+bg+';color:'+fg+
     ';border:1px solid '+bd+';border-radius:7px;padding:7px 3px;font-size:12px;font-weight:600;line-height:16px">'+
     (st<cur&&k!==base?'✓ ':'')+USTATUS[k].t+
     '<div style="font-size:10px;font-weight:400;opacity:.86;margin-top:2px">'+
     (k==='waitAssign'?'预警 · 可跳过':(USTATUS[k].phase==='warn'?'预警阶段':'工单阶段'))+'</div></div>';
 });
 h+='</div>';
 if(side)h+='<div class="tipbar red" style="display:block;margin-top:8px"><b>旁支状态 · '+USTATUS[r.status].t+
  '</b>：'+USTATUS[r.status].d+'。主链进度停留在「'+USTATUS[base].t+
  '」，处理后回到主链；超时 / 退回事实写入流转留痕，不因状态回退而清除。</div>';
 return h;
}
function uDetailBody(r){
 var S=USTATUS[r.status],lvTxt=ULV[r.lv]||r.lv;

function uTransition(id,act){
 var r=uFind(id);if(!r)return;
 var t=(UTRANS[r.status]||[]).filter(function(x){return x.a===act})[0];if(!t)return;
 var old=USTATUS[r.status].t,to=t.to;
 var unit=r.unit||'';
 if(act==='confirm')to=unit?'waitSign':'waitAssign';
 if(act==='assign')to=unit?'waitSign':'waitAssign';
 if(act==='confirm'||act==='assign'){
  if(!r.wo){
   var sg=byId(DB.signals,r.id)||byId(DB.signals,r.srcId||'');
   if(sg){var o=uPromoteSignal(sg,to);r.wo=o.id;r.srcId=o.id;r.pcId=o.id}
   else r.wo=uNextWo();
  }
  if(unit)r.unit=unit;
 }
 if(act==='falseAlarm')r.wo='';
 if(act==='sign')r.signAt=nowHM();
 if(act==='markOvertime')r.overtime=1;
 if(act==='urge')r.overtime=r.overtime||1;
 if(act==='submitResult')r.report=r.report||'现场明火已扑灭，过火面积待复核，已上传现场处置记录';
 if(act==='recheckBack')r.recheck='复核不通过：需补充过火面积认定、现场复核照片与处置人签字';
 if(act==='recheckPass')r.recheck='复核通过，处置结果与现场一致';
 if(act==='resubmit'){r.recheck='';r.report=(r.report||'')+'（已补充材料并重新提交）'}
 if(act==='rework')r.recheck='';
 r.status=to;
 var tx=old+' → '+USTATUS[to].t+'：'+t.t+(r.wo?'（'+r.wo+'）':'');
 if((act==='confirm'||act==='assign')&&r.judgeLv)tx+='；人工定级 '+(ULV[r.judgeLv]||r.judgeLv)+
   '；处置时限 '+(r.limit||'—')+(unit?'；处置单位 '+unit:'（未指派）');
 if(act==='falseAlarm'&&r.falseReason)tx+='；原因：'+r.falseReason+(r.falseNote?'；备注：'+r.falseNote:'');
 r.timeline.push({t:nowHM(),b:'PC 后台 · '+ME.n,x:tx});
 var o2=O(r.srcId)||O(r.wo)||O(r.pcId);
 if(o2){
  o2.st=U_TO_ST[to]||o2.st;o2.uStatus=to;
  if(act==='markOvertime'||r.overtime)o2.uOvertime=1;
  if(act==='recheckBack')o2.uRecheck=r.recheck;
  if(act==='sign')o2.sign=now();
  if((act==='confirm'||act==='assign')&&unit)o2.owner=unit;
  if(act==='falseAlarm'){o2.st='falseAlarm'}
  addEv(o2,'统一详情状态流转：'+old+' → '+USTATUS[t.to].t+'（'+t.t+'）');
 }
 logit('统一状态流转 '+old+'→'+USTATUS[t.to].t,r.id+(r.wo?' / '+r.wo:''));
 save();render();openUnified(r.id);
 toast('状态已更新：'+USTATUS[to].t,'ok');
}
/* 大屏状态变更广播 → 合并回 PC 后台同库记录 */
function uOnScreenSync(){
 try{
  var bc=new BroadcastChannel('dyyj_sync');
  bc.onmessage=function(e){
   if(!e.data||e.data.from!=='SCREEN')return;
   try{
    var raw=JSON.parse(localStorage.getItem(KEY)||'{}');
    var arr=raw&&raw[SHARED_NS];if(!Array.isArray(arr))return;
    arr.forEach(function(x){
     var r=uFind(x.id)||uFind(x.wo||'');
     if(!r){uRecs().push(x);return}
     if(USTATUS[x.status]){r.status=x.status;r.wo=x.wo||r.wo;r.overtime=x.overtime||0;
      if(Array.isArray(x.timeline)&&x.timeline.length)r.timeline=x.timeline}
     var oo=O(r.srcId)||O(r.wo)||O(r.pcId);
     if(oo&&U_TO_ST[x.status]){oo.st=U_TO_ST[x.status];oo.uStatus=x.status}
    });
    render();
   }catch(err){}
  };
 }catch(e){}
}

var DB=null;
/* 旧数据中的旧概念值统一替换为工单语义（仅值，不改数据键，保证与移动端同源） */
function unifyOrderTerms(v){
 if(typeof v==='string')return v.split(LEGACY.word).join('工单');
 if(Array.isArray(v)){v.forEach(function(x,i){v[i]=unifyOrderTerms(x)});return v}
 if(v&&typeof v==='object'){Object.keys(v).forEach(function(k){v[k]=unifyOrderTerms(v[k])});return v}
 return v;
}
function load(){
 var legacyNS=null;
 try{var raw=JSON.parse(localStorage.getItem(KEY)||'{}');if(raw&&Array.isArray(raw[SHARED_NS]))legacyNS=raw[SHARED_NS]}catch(e){}
 try{var s=localStorage.getItem(KEY);if(s){DB=JSON.parse(s);if(!DB||!DB.orders)DB=seed();}else{DB=seed();}}
 catch(e){DB=seed();}
 /* 大屏先写入共享命名空间时，PC 侧仍以自身业务字段为主库，同时保留同库统一记录 */
 if(legacyNS&&!Array.isArray(DB[SHARED_NS]))DB[SHARED_NS]=legacyNS;
 if(!Array.isArray(DB[SHARED_NS]))DB[SHARED_NS]=[];
 /* 兼容旧共用数据源：工单语义统一 + 单一工单等级字典 */
 try{
  unifyOrderTerms(DB);
  if(!DB.dict)DB.dict={};
  var d=DB.dict;
  delete d[LEGACY.status];delete d[LEGACY.lv];delete d[LEGACY.risklv];
  d['工单类型']=ETYPE.slice();
  d['工单等级']=ELV_ORDER.map(function(k){return ELV[k].t});
  d['工单状态']=Object.keys(ST).map(function(k){return ST[k].t});
  (DB.sms||[]).forEach(function(x){x.c=String(x.c||'').split(LEGACY.smsVar).join('{工单编号}').split('{工单号}').join('{工单编号}')});
 }catch(e){}
 if(!Array.isArray(DB.sigLedger))DB.sigLedger=[];
 uSync();
 if(legacyNS)try{save()}catch(e){}
 return DB;
}
function save(){
 try{DB.meta.lastSync=now();localStorage.setItem(KEY,JSON.stringify(DB));
   try{var bc=new BroadcastChannel('dyyj_sync');bc.postMessage({t:Date.now(),from:'PC'});bc.close();}catch(e){}
 }catch(e){toast('本地存储不可用，数据仅在当前页面有效','err');}
}
function resetDB(){DB=seed();DB[SHARED_NS]=[];uSync();save();toast('已重置为演示初始数据');render();}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function $(id){return document.getElementById(id)}
function O(id){for(var i=0;i<DB.orders.length;i++)if(DB.orders[i].id===id)return DB.orders[i];return null}
function byId(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}
function lvTag(k){var e=ELV[k]||{c:'lv-gray',t:k};return '<span class="lv '+e.c+'">'+esc(elvName(k))+'</span>'}
function riskTag(r){
 var pre=(r&&r.pre)||'火险等级';
 var n=pre==='火险等级'?'火险':pre==='气象暴雨预警'?'暴雨':pre==='地质灾害气象风险'?'地灾风险':'预警';
 var l=ELV[(r&&r.lv)||'blue']||{c:'lv-gray',t:(r&&r.lv)||'—'};
 return '<span class="lv '+l.c+'">'+n+'·'+l.t+'</span>';
}
function stTag(k){var s=ST[k]||{t:k,c:'lv-gray'};return '<span class="lv '+s.c+'">'+esc(s.t)+'</span>'}
/* 事前预警状态：兼容旧数据（旧版以 span='已解除' 表示） */
function riskSt(r){return (r&&r.st)||((r&&r.span)==='已解除'?'已解除':'生效中')}
function latestRisk(){
 var act=DB.risk.filter(function(r){return riskSt(r)!=='已解除'});
 return act[0]||DB.risk[0]||{};
}
/* 措施库：优先取共用数据源，兼容旧版无 msLib 的数据 */
function getMsLib(){
 var cur=(DB&&DB.msLib)||{},out={};
 MS_LEVELS.forEach(function(k){out[k]=Array.isArray(cur[k])?cur[k].slice():MS_LIB[k].slice()});
 return out;
}
function phTag(k){var p=PHASE[k]||'—',c=p==='待受理'?'lv-red':(p==='处置中'?'lv-orange':'lv-gray');return '<span class="lv '+c+'">'+p+'</span>'}
function cdText(ms){
 if(ms==null||ms===0)return '—';
 var s=Math.floor((ms-Date.now())/1000);
 if(s<0)return '已超时 '+Math.floor(-s/60)+' 分 '+(-s%60)+' 秒';
 var h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60,p=function(x){return x<10?'0'+x:''+x};
 return h>0?(h+':'+p(m)+':'+p(ss)):(p(m)+':'+p(ss));
}
function cdSpan(ms,tip){
 if(!ms)return '<span class="muted">—</span>';
 var over=ms-Date.now()<0;
 return '<span class="cd'+(over?' over':'')+'" data-cd="'+ms+'">'+cdText(ms)+'</span>';
}
function logit(act,tar){DB.logs.unshift({t:now(),u:ME.n+'（'+ME.r+'）',act:act,tar:tar});if(DB.logs.length>300)DB.logs.pop()}
function addEv(o,txt,role){
 o.events=o.events||[];o.events.push({t:nowHM(),b:(role||ME.n+'（'+ME.r+'）'),x:txt});

function toast(msg,type){

 el.innerHTML='<div>'+esc(msg)+'</div>';$('toastRoot').appendChild(el);

}
/* 背景滚动锁：只要还有弹窗或抽屉打开就锁定，全部关闭后立即恢复 */
function syncBodyLock(){
 var d=$('drawerWrap'),m=$('modalRoot');
 var open=(d&&d.style.display==='block')||(m&&m.innerHTML!=='');
 document.body.style.overflow=open?'hidden':'';
}
function modal(html,opt){
 opt=opt||{};
 var root=$('modalRoot');root.innerHTML='<div class="mask" style="align-items:'+(opt.center?'center':'flex-start')+';justify-content:center;padding-top:'+(opt.center?'0':'6vh')+'">'+
  '<div class="dlg" style="'+(opt.width?'width:'+opt.width:'')+'">'+html+'</div></div>';
 root.querySelector('.mask').onclick=function(e){if(e.target===this)closeModal()};
 syncBodyLock();
}

function confirmBox(title,desc,onOk,okText){
 modal('<h3>'+esc(title)+'</h3><div class="sub">'+desc+'</div>'+
  '<div class="row" style="justify-content:flex-end;gap:8px;margin-top:16px">'+
  '<button class="btn line" onclick="closeModal()">取消</button>'+
  '<button class="btn" id="_okBtn">'+esc(okText||'确定')+'</button></div>');
 $('_okBtn').onclick=function(){closeModal();onOk()};
}
function openDrawer(title,sub,body,footer){

  (sub?'<span class="tiny" style="opacity:.85">'+esc(sub)+'</span>':'')+
  '<button class="btn line" style="margin-left:auto" onclick="closeDrawer()">关闭</button></div>'+
  '<div class="db">'+body+'</div>'+(footer?'<div class="df">'+footer+'</div>':'');
 syncBodyLock();
}
function closeDrawer(){$('drawerWrap').style.display='none';$('drawer').innerHTML='';syncBodyLock()}

document.addEventListener('keydown',function(e){

 var m=$('modalRoot'),d=$('drawerWrap');

 else if(d&&d.style.display==='block')closeDrawer();

var SIG_ACT={
 confirm:{t:'确认预警 · 生成工单',c:'lv-red'},
 check:{t:'转待核查 · 核查工单',c:'lv-orange'},
 false:{t:'误报忽略 · 解除预警',c:'lv-gray'},
 merge:{t:'重复信号归并',c:'lv-blue'}
};
function sigActTag(k){var a=SIG_ACT[k]||{t:k||'—',c:'lv-gray'};return '<span class="lv '+a.c+'">'+esc(a.t)+'</span>'}
function sigKey(r){return [r.act,r.sid||'',r.oid||'',r.src||'',r.recv||'',String(r.d||'').slice(0,20)].join('|')}
function sigOperator(){return (typeof ME!=='undefined'&&ME&&ME.n)?ME.n+'（'+ME.r+'）':'—'}
/* 统一写入口：同一信号同一结论只保留一条，按处置时间倒序 */
function addSigLedger(rec){
 if(!Array.isArray(DB.sigLedger))DB.sigLedger=[];
 rec.id=rec.id||('TZ'+Date.now().toString().slice(-8)+String(DB.sigLedger.length+1).padStart(2,'0'));
 rec.at=rec.at||now();rec.by=rec.by||sigOperator();rec.note=rec.note||'';rec.act=rec.act||'confirm';
 var k=sigKey(rec),i=DB.sigLedger.findIndex(function(x){return sigKey(x)===k});
 if(i>=0){var old=DB.sigLedger[i],keep=old.id;Object.keys(rec).forEach(function(f){if(f!=='id')old[f]=rec[f]});old.id=keep}
 else DB.sigLedger.unshift(rec);
 DB.sigLedger.sort(function(a,b){return String(b.at||'').localeCompare(String(a.at||''))});
 if(DB.sigLedger.length>500)DB.sigLedger.length=500;
}
/* 兜底回填：从既有工单 / 误报登记 / 移动端上报反查已处置信号，历史处置同样进台账 */
function syncSigLedger(){
 if(!Array.isArray(DB.sigLedger))DB.sigLedger=[];
 var keys={};DB.sigLedger.forEach(function(x){keys[sigKey(x)]=1});
 var changed=false;
 var add=function(rec){
  var k=sigKey(rec);if(keys[k])return;
  keys[k]=1;rec.id=rec.id||'HIS'+String(DB.sigLedger.length+1).padStart(3,'0');
  rec.by=rec.by||'历史数据';rec.at=rec.at||now();rec.note=rec.note||'';
  DB.sigLedger.push(rec);changed=true;
 };
 (DB.orders||[]).forEach(function(o){
  (o.signals||[]).forEach(function(sg){
   add({act:(o.st==='checking'||/核查任务/.test(o.title||''))?'check':'confirm',
    sid:sg.sid||'',type:o.type,src:sg.s||'',recv:sg.recv||sg.t||'',area:o.area||'',place:o.place||'',d:sg.d||'',
    lv:o.lv||'',oid:o.id,note:'',at:o.create||'',by:(o.events&&o.events[0]&&o.events[0].b)||'历史数据'});
  });

 setPt(lng,lat,addr);

/* · 图层点位 · */
P.sysLayer=function(){
 var h='<div class="card"><div class="hd"><h3>图层管理<span class="sub">支持 ArcGIS / WMS / SuperMap 三维 · 共 '+DB.layers.length+' 个图层</span></h3>'+
  '<button class="btn btn-xs" onclick="layerForm()">＋ 新增图层</button></div>'+
  '<table class="tb"><tr>'+tbcols(['图层名称','分组','类型','服务地址','状态','操作'])+'</tr>'+
  (DB.layers.map(function(l,i){return '<tr><td>'+esc(l.n)+'</td><td>'+esc(l.g)+'</td><td>'+esc(l.t)+'</td>'+
   '<td class="small muted">'+esc(l.u)+'</td><td>'+(l.on?'<span class="lv lv-green">启用</span>':'<span class="lv lv-gray">停用</span>')+'</td>'+
   '<td class="nowrap"><span class="lnk" onclick="toggleLayer('+i+')">'+(l.on?'停用':'启用')+'</span>'+
   '<span class="lnk" onclick="layerForm('+i+')">编辑</span><span class="lnk danger" onclick="delLayer('+i+')">删除</span></td></tr>'}).join('')||'')+
  '</table><div class="bd"><div class="tipbar">图层点位可作为工单点位、到场打卡点、物资点的统一底座，供 PC / 移动端 / 大屏共用。</div></div></div>';
 return h;
};
function layerForm(i){
 var l=i>=0?DB.layers[i]:{n:'',g:'',t:'',u:''};
 modal('<h3>'+(i>=0?'编辑':'新增')+'图层</h3>'+
  '<div class="fi"><span class="lab">图层名称</span><span class="val"><input class="f" id="_lyN" value="'+esc(l.n)+'"></span></div>'+
  '<div class="fi"><span class="lab">分组</span><span class="val"><input class="f" id="_lyG" value="'+esc(l.g)+'" placeholder="基础底图 / 专题图层 / 自定义点位图层"></span></div>'+
  '<div class="fi"><span class="lab">类型</span><span class="val"><input class="f" id="_lyT" value="'+esc(l.t)+'" placeholder="ArcGIS / WMS / SuperMap 三维 / 点位"></span></div>'+
  '<div class="fi"><span class="lab">服务地址</span><span class="val"><input class="f" id="_lyU" value="'+esc(l.u)+'"></span></div>'+
  '<div class="row mt12"><button class="btn" onclick="doLayer('+i+')">保存</button>'+
  '<button class="btn line" style="margin-left:auto" onclick="closeModal()">取消</button></div>');
}
function doLayer(i){
 var g=function(id){return ($(id)||{}).value||''};
 if(!g('_lyN')){toast('请填写图层名称','err');return}
 var it={n:g('_lyN'),g:g('_lyG'),t:g('_lyT'),u:g('_lyU')};
 if(i>=0){it.on=DB.layers[i].on;DB.layers[i]=it;logit('编辑图层',it.n)}
 else{it.on=1;DB.layers.push(it);logit('新增图层',it.n)}
 save();closeModal();toast('已保存','ok');render();
}
function toggleLayer(i){DB.layers[i].on=DB.layers[i].on?0:1;logit('图层'+(DB.layers[i].on?'启用':'停用'),DB.layers[i].n);save();render()}
function delLayer(i){
 var l=DB.layers[i];
 confirmDel('删除图层',esc(l.n),function(){
  DB.layers.splice(i,1);logit('删除图层',l.n);save();closeModal();toast('已删除','ok');render();
 });
}

/* · 视频源接入 · */
P.sysVideo=function(){
 var dv=DB.devices;
 var h='<div class="card mb8"><div class="hd"><h3>数据源接入与设备同步</h3><button class="btn btn-xs" onclick="syncDevices()">立即同步</button></div>'+
  '<div class="bd"><div class="grid g4">'+
   kpiCard('同步时间',dv.syncTime,'','b','')+kpiCard('同步周期',dv.interval,'','','')+
   kpiCard('分组数',dv.groups,'','b','')+kpiCard('摄像头总数',dv.cams,'','g','')+'</div></div></div>';
 h+='<div class="card"><div class="hd"><h3>视频源列表<span class="sub">共 '+dv.list.length+' 个设备</span></h3></div><table class="tb">'+
  '<tr>'+tbcols(['设备名称','类型','纬度','经度','在线状态','操作'])+'</tr>'+
  (dv.list.map(function(d,i){return '<tr><td>'+esc(d.n)+'</td><td>'+esc(d.t)+'</td><td class="mono">'+esc(d.lat)+'</td><td class="mono">'+esc(d.lng)+'</td>'+
   '<td>'+(d.st==='在线'?'<span class="lv lv-green">在线</span>':'<span class="lv lv-red">离线</span>')+'</td>'+
   '<td class="nowrap"><span class="lnk danger" onclick="delDevice('+i+')">删除</span></td></tr>'}).join('')||'')+'</table></div>';
 return h;
};
function delDevice(i){
 var d=DB.devices.list[i];
 confirmDel('删除设备',esc(d.n),function(){
  DB.devices.list.splice(i,1);logit('删除视频源设备',d.n);save();closeModal();toast('已删除','ok');render();
 });
}

/* · 告警类型 · */
P.sysType=function(){
 var h='<div class="tipbar info mb8">告警类型是平台全局一级维度：六类告警共用同一套闭环主流程（总览 → 研判 → 派发 → 处置 → 核查 → 归档），在<b>研判要点、默认派发单位、处置时限、结果报告字段、反馈类型、核查要点</b>上差异化配置。新增灾种只需在此扩展字典，无需改动流程代码。</div>';
 h+='<div class="grid g2">'+AT_ORDER.map(function(k){
  var a=ATYPE[k];
  return '<div class="card"><div class="hd"><h3>'+typeTag(k)+' <span class="sub">'+esc(a.cat||'')+'</span></h3></div><div class="bd">'+
   '<div class="tiny muted mb8">'+esc(a.desc||'')+'</div>'+
   '<div class="kv"><span class="k">研判时限</span><span class="v">'+Math.round(a.limit.judge/60)+' 分钟</span></div>'+
   '<div class="kv"><span class="k">处置时限</span><span class="v">反馈 '+(a.limit.feedback/60)+' 分 / 报告 '+(a.limit.report/60)+' 分</span></div>'+
   '<div class="kv"><span class="k">默认派发</span><span class="v">'+a.units.map(function(u){return u.replace('{area}','属地')}).join('、')+'</span></div>'+
   '<div class="kv"><span class="k">典型信号源</span><span class="v">'+a.srcs.join(' / ')+'</span></div>'+
   '<div class="hr"></div><div class="tiny muted">研判要点</div>'+
   a.judge.map(function(j){return '<div class="row small" style="align-items:flex-start;margin-top:4px"><span class="lv lv-blue">✓</span><span style="line-height:18px">'+esc(j)+'</span></div>'}).join('')+
   '<div class="tiny muted mt8">结果报告字段</div>'+
   '<div>'+a.fields.map(function(f){return '<span class="tag">'+esc(f.n)+'</span>'}).join('')+'</div>'+
   '<div class="tiny muted mt8">核查要点</div>'+
   (a.verifyKeys||[]).map(function(v){return '<div class="row small" style="align-items:flex-start;margin-top:4px"><span class="lv lv-gray">•</span><span style="line-height:18px">'+esc(v)+'</span></div>'}).join('')+
   '</div></div>';
 }).join('')+'</div>';
 return h;
};
function addDictItem(k){
 modal('<h3>新增字典项 · '+esc(k)+'</h3><div class="sub">字典统一管理，改动后端到端同步</div>'+
  '<div class="fi"><span class="lab">字典值</span><span class="val"><input class="f" id="_dv" placeholder="输入新的字典项"></span></div>'+
  '<div class="row mt12"><button class="btn" onclick="doAddDict(\''+k+'\')">保存</button>'+
  '<button class="btn line" style="margin-left:auto" onclick="closeModal()">取消</button></div>');
}
function doAddDict(k){
 var v=($('_dv')||{}).value;if(!v){toast('请输入字典值','err');return}
 DB.dict[k].push(v);logit('新增字典项',k+'：'+v);save();closeModal();toast('已新增字典项','ok');render();
}
function syncDevices(){
 DB.devices.syncTime=now();logit('手动同步视频源设备','934 分组 / 5696 路');save();toast('设备同步完成','ok');render();
}

/* ---------- 操作日志 ---------- */
P.logs=function(){
 var h='<div class="tipbar info mb8">关键操作（审批 / 派发 / 签收 / 到场 / 反馈 / 报告 / 核查 / 退回 / 归档 / 等级调整）全部留痕，与等级调整审批要求联动。</div>';
 h+='<div class="card"><div class="hd"><h3>操作留痕（'+DB.logs.length+' 条）</h3></div>'+
  '<table class="tb"><tr>'+tbcols(['时间','操作人','动作','对象'])+'</tr>'+
  (DB.logs.map(function(l){return '<tr><td class="nowrap mono">'+esc(l.t)+'</td><td>'+esc(l.u)+'</td><td>'+esc(l.act)+'</td><td class="small">'+esc(l.tar)+'</td></tr>'}).join('')||
   '<tr><td colspan="4">'+emptyBox()+'</td></tr>')+'</table></div>';
 return h;
};

function download(name,content,type){
 var b=new Blob([content],{type:type||'text/plain;charset=utf-8'});
 var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
 document.body.appendChild(a);a.click();a.remove();
}
/* ==================================================================
   启动
   ================================================================== */
load();
if(!ME||!ME.n||ME.n==='—')ME=DB.roles[0];
uOnScreenSync();
var k0=cur();if(TITLE[k0])S.page=k0;
render();
</script>
